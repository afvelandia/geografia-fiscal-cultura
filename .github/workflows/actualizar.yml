name: Actualización mensual y publicación

on:
  schedule:
    - cron: "0 11 5 * *"      # día 5 de cada mes, 11:00 UTC (06:00 en Bogotá)
  workflow_dispatch: {}        # ejecución manual desde la pestaña Actions
  push:
    branches: [main]
    paths: ["site/**"]         # republica si se edita el diseño

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (versiones fijas)
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline verificado
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          python -W ignore pipeline/01_descarga.py
          python -W ignore pipeline/02_base.py
          python -W ignore pipeline/03_analisis.py
          python -W ignore pipeline/04_concentracion.py
          python -W ignore pipeline/06_geo.py
          python -W ignore pipeline/07_exportar_web.py   # falla si alguna validación no se cumple

      - name: Guardar resultados en el historial (auditable)
        if: github.event_name != 'push'
        run: |
          git config user.name  "actualizacion-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/descargas data/out data/raw/procedencia.json data/procedencia_geo.json
          git commit -m "Actualización automática de datos $(date -u +%Y-%m-%d)" || echo "Sin cambios en los datos"
          git push

      - name: Archivar los datos crudos de esta versión (release con checksums)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="datos-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf crudos.tar.gz -C data raw
          gh release create "$TAG" crudos.tar.gz data/raw/procedencia.json \
            --title "Datos crudos $TAG" \
            --notes "Archivos descargados de las fuentes oficiales en esta actualización. Verifique los SHA-256 con procedencia.json."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
